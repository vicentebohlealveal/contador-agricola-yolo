<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Contador Agrícola ONNX</title>
<!-- Librería oficial de Microsoft para correr modelos ONNX en el navegador -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>
  :root{
    --bg:#000; --panel:#111; --line:#2A2A2A; --text:#FFFFFF; --dim:#9A9A9A;
    --accent:#39FF6A; --danger:#FF4B4B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,Roboto,sans-serif; min-height:100vh;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 40px;}
  h1{font-size:22px;font-weight:800;margin:0 0 4px;}
  .subtitle{color:var(--dim);font-size:13px;margin-bottom:20px;}

  .add-row{display:flex;gap:8px;margin-bottom:20px;}
  .add-row input{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:14px;color:var(--text);font-size:16px;outline:none;}
  .add-row input:focus{border-color:var(--accent);}
  .btn{border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:15px;}
  .btn-accent{background:var(--accent);color:#000;padding:14px 18px;}
  .btn-block{width:100%;padding:18px;font-size:17px;}
  .btn-outline{background:transparent;border:2px solid var(--line);color:var(--text);padding:12px;}
  .btn-danger{background:var(--danger);color:#fff;}

  .species-card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer;}
  .species-card .sp-name{font-size:19px;font-weight:800;color:var(--accent);}
  .species-tree{display:flex;justify-content:space-between;font-size:15px;color:var(--dim);margin-top:6px;padding-left:8px;}
  .species-tree b{color:var(--text);font-weight:700;}
  .empty{color:var(--dim);text-align:center;padding:30px 10px;border:2px dashed var(--line);border-radius:12px;font-size:14px;}

  #view2{display:none;}
  .back-btn{background:none;border:none;color:var(--text);font-size:16px;font-weight:700;margin-bottom:14px;cursor:pointer;padding:0;}
  .cam-title{font-size:16px;color:var(--dim);margin-bottom:2px;}
  .tree-label{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:12px;}

  .cam-wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#111;border:2px solid var(--line);}
  video{width:100%;display:block;}
  #overlay{position:absolute;top:0;left:0;width:100%;height:100%;}

  .live-count-container{display:flex;align-items:center;justify-content:center;margin:18px 0;position:relative;}
  .live-count{text-align:center;}
  .live-count .num{font-size:88px;font-weight:900;line-height:1;color:var(--accent);}
  .live-count .lbl{font-size:14px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-top:4px;}
  
  .reset-btn{position:absolute;right:10px;background:var(--panel);border:2px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold;}

  .status{text-align:center;color:var(--dim);font-size:13px;margin-bottom:10px;min-height:32px;line-height:1.4;}
  .status.error{color:var(--danger);font-weight:700;}
  .status.success{color:var(--accent);font-weight:700;}

  .sens-box{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;}
  .sens-label{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:8px;}
  .sens-label b{color:var(--accent);font-size:14px;}
  .sens-box input[type=range]{width:100%;accent-color:var(--accent);height:26px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:99;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:22px;max-width:380px;width:100%;text-align:center;}
  .modal-box p{font-size:15px;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn{flex:1;padding:13px;}
</style>
</head>
<body>

<div id="view1" class="wrap">
  <h1>🌱 Contador Agrícola PRO</h1>
  <div class="subtitle">Modelo Custom YOLO ONNX - 100% Local</div>
  <div class="add-row">
    <input type="text" id="inputNuevaEspecie" placeholder="Nueva especie (ej: Limones)">
    <button class="btn btn-accent" id="btnAgregarEspecie">Añadir</button>
  </div>
  <div id="listaEspecies"></div>
  <button class="btn btn-outline btn-block" id="btnBorrarTodo" style="margin-top:24px;color:var(--danger);border-color:var(--danger);">⚠️ Borrar toda la memoria</button>
</div>

<div id="view2" class="wrap">
  <button class="back-btn" id="btnVolver">← Volver</button>
  <div class="cam-title" id="camEspecieLabel">Especie</div>
  <div class="tree-label" id="camArbolLabel">Árbol 1</div>
  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="status" id="statusMsg">Cargando modelo neuronal...</div>

  <div class="sens-box">
    <div class="sens-label"><span>Certeza mínima</span><b id="umbralTexto">50%</b></div>
    <input type="range" id="sliderUmbral" min="0.1" max="1.0" step="0.01" value="0.5">
  </div>

  <div class="live-count-container">
    <div class="live-count">
      <div class="num" id="liveCountNum">0</div>
      <div class="lbl">frutos ACUMULADOS</div>
    </div>
    <button class="reset-btn" id="btnResetConteo">🔄 Reiniciar<br>Paneo</button>
  </div>

  <button class="btn btn-accent btn-block" id="btnGuardarSiguiente" disabled>💾 Guardar y Siguiente Árbol</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <p id="modalText">¿Confirmar?</p>
    <div class="modal-actions">
      <button class="btn btn-outline" id="modalCancel">Cancelar</button>
      <button class="btn btn-danger" id="modalConfirm">Confirmar</button>
    </div>
  </div>
</div>

<script>
/* ---------------- ARCHIVO LOCAL ONNX ---------------- */
const MODEL_URL = "./best.onnx"; 

/* ---------------- PERSISTENCIA ---------------- */
const STORAGE_KEY = 'registrosAgricolasONNX';
function cargarMemoria(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; } }
function guardarMemoria(mem){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(mem)); }catch(e){} }

let memoria = cargarMemoria();
let especieActual = null;
let arbolActualNum = 1;
let umbralActual = 0.5;

/* ---------------- VISTA DASHBOARD ---------------- */
const view1 = document.getElementById('view1');
const view2 = document.getElementById('view2');
const listaEspecies = document.getElementById('listaEspecies');
const inputNuevaEspecie = document.getElementById('inputNuevaEspecie');

function renderDashboard(){
  const nombres = Object.keys(memoria);
  if(nombres.length === 0){
    listaEspecies.innerHTML = '<div class="empty">Todavía no hay especies registradas</div>';
    return;
  }
  listaEspecies.innerHTML = '';
  nombres.forEach(especie=>{
    const arboles = memoria[especie];
    const nombresArboles = Object.keys(arboles);
    const totalFrutos = nombresArboles.reduce((s,a)=> s + (arboles[a]||0), 0);
    const card = document.createElement('div');
    card.className = 'species-card';
    card.innerHTML = `<div class="sp-name">🌿 ${escapeHtml(especie)}</div><div class="species-tree"><span>${nombresArboles.length} árbol(es)</span><b>${totalFrutos} frutos</b></div>`;
    card.addEventListener('click', ()=> entrarACamara(especie));
    listaEspecies.appendChild(card);
  });
}

document.getElementById('btnAgregarEspecie').addEventListener('click', ()=>{
  const nombre = inputNuevaEspecie.value.trim();
  if(!nombre) return;
  if(!memoria[nombre]) memoria[nombre] = {};
  guardarMemoria(memoria);
  inputNuevaEspecie.value = '';
  renderDashboard();
});
inputNuevaEspecie.addEventListener('keydown', e=>{ if(e.key === 'Enter') document.getElementById('btnAgregarEspecie').click(); });

document.getElementById('btnBorrarTodo').addEventListener('click', ()=>{
  showModal('¿Borrar TODA la memoria del celular?', ()=>{ memoria = {}; guardarMemoria(memoria); renderDashboard(); });
});

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const modalOverlay = document.getElementById('modalOverlay');
const modalText = document.getElementById('modalText');
let modalCallback = null;
function showModal(texto, onConfirm){ modalText.textContent = texto; modalCallback = onConfirm; modalOverlay.classList.add('show'); }
document.getElementById('modalCancel').addEventListener('click', ()=>{ modalOverlay.classList.remove('show'); modalCallback = null; });
document.getElementById('modalConfirm').addEventListener('click', ()=>{ modalOverlay.classList.remove('show'); if(modalCallback) modalCallback(); modalCallback = null; });

/* ---------------- CÁMARA Y VARIABLES DE IA ---------------- */
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const statusMsg = document.getElementById('statusMsg');
const liveCountNum = document.getElementById('liveCountNum');
const btnGuardarSiguiente = document.getElementById('btnGuardarSiguiente');
const btnResetConteo = document.getElementById('btnResetConteo');
const camEspecieLabel = document.getElementById('camEspecieLabel');
const camArbolLabel = document.getElementById('camArbolLabel');
const sliderUmbral = document.getElementById('sliderUmbral');
const umbralTexto = document.getElementById('umbralTexto');

let session = null;
let cameraStream = null;
let loopActivo = false;
let isProcessing = false;

// Para procesar imágenes a 640x640 (formato YOLO)
const INPUT_DIM = 640;
const canvas640 = document.createElement('canvas');
canvas640.width = INPUT_DIM;
canvas640.height = INPUT_DIM;
const ctx640 = canvas640.getContext('2d', { willReadFrequently: true });

/* --- VARIABLES DE TRACKING (ACUMULADOR) --- */
let globalCount = 0;
let nextTrackId = 1;
let activeTracks = [];
const MAX_DISTANCE = 0.2; // 20% de la pantalla como tolerancia de movimiento
const MAX_MISSED = 8;     

sliderUmbral.addEventListener('input', ()=>{ umbralActual = parseFloat(sliderUmbral.value); umbralTexto.textContent = Math.round(umbralActual * 100) + '%'; });
btnResetConteo.addEventListener('click', ()=>{ resetearTracker(); });

function resetearTracker() {
  globalCount = 0;
  nextTrackId = 1;
  activeTracks = [];
  liveCountNum.textContent = '0';
  octx.clearRect(0, 0, overlay.width, overlay.height);
}

async function entrarACamara(especie){
  especieActual = especie;
  const arboles = memoria[especieActual];
  arbolActualNum = Object.keys(arboles).length + 1;
  camEspecieLabel.textContent = especieActual;
  camArbolLabel.textContent = `Árbol ${arbolActualNum}`;
  resetearTracker();
  btnGuardarSiguiente.disabled = true;
  statusMsg.className = 'status';
  statusMsg.textContent = 'Iniciando cámara y modelo…';
  view1.style.display = 'none'; view2.style.display = 'block';

  await iniciarCamara();
  await iniciarModelo();

  if(cameraStream && session){
    btnGuardarSiguiente.disabled = false;
    statusMsg.classList.add('success');
    statusMsg.textContent = 'Modelo Listo. ¡Detectando!';
    if(!loopActivo){ loopActivo = true; requestAnimationFrame(loopDeteccion); }
  }
}

async function iniciarCamara(){
  if(cameraStream) return;
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 640 } }
    });
    video.srcObject = cameraStream;
    await new Promise(res => { video.onloadedmetadata = () => { video.play(); res(); }; });
    overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  }catch(err){
    statusMsg.classList.add('error');
    statusMsg.textContent = 'Error de cámara: dale permiso al sitio.';
  }
}

async function iniciarModelo(){
  if(session) return;
  try{
    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/';
    // Ejecuta el modelo optimizado para WebAssembly
    session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: ['wasm'] });
  }catch(err){
    statusMsg.classList.add('error');
    statusMsg.textContent = 'Error cargando best.onnx. ¿Está en la misma carpeta?';
    console.error(err);
  }
}

/* --- FUNCIÓN PRINCIPAL DE VISIÓN --- */
async function loopDeteccion(){
  if(!loopActivo) return;
  requestAnimationFrame(loopDeteccion);

  // Evitamos saturar el procesador
  if(isProcessing || !session || video.readyState < 2) return;
  isProcessing = true;

  try {
    // 1. Preparar la imagen para la IA (640x640 y dividir por 255)
    ctx640.drawImage(video, 0, 0, INPUT_DIM, INPUT_DIM);
    const imgData = ctx640.getImageData(0, 0, INPUT_DIM, INPUT_DIM).data;
    const float32Data = new Float32Array(3 * INPUT_DIM * INPUT_DIM);
    
    // Convertir RGBA a formato CHW [Canal, Alto, Ancho]
    for (let i = 0, j = 0; i < imgData.length; i += 4, j++) {
      float32Data[j] = imgData[i] / 255.0; // R
      float32Data[INPUT_DIM * INPUT_DIM + j] = imgData[i + 1] / 255.0; // G
      float32Data[2 * INPUT_DIM * INPUT_DIM + j] = imgData[i + 2] / 255.0; // B
    }

    const tensor = new ort.Tensor('float32', float32Data, [1, 3, INPUT_DIM, INPUT_DIM]);

    // 2. Ejecutar Inferencia
    const results = await session.run({ images: tensor });
    const output = results[Object.keys(results)[0]].data; // Matriz YOLO plana

    // 3. Post-Procesamiento (Decodificar las 8400 cajas de YOLO)
    let cajasCandidatas = [];
    const NUM_CAJAS = 8400;

    for (let i = 0; i < NUM_CAJAS; i++) {
      // output shape: [1, 5, 8400] -> X, Y, W, H, Confianza
      let conf = output[4 * NUM_CAJAS + i];
      if (conf >= umbralActual) {
        let cx = output[0 * NUM_CAJAS + i];
        let cy = output[1 * NUM_CAJAS + i];
        let w = output[2 * NUM_CAJAS + i];
        let h = output[3 * NUM_CAJAS + i];

        cajasCandidatas.push({
          x: cx - w/2, y: cy - h/2, w: w, h: h,
          cx: cx, cy: cy, conf: conf
        });
      }
    }

    // 4. Limpieza (Non-Maximum Suppression) para borrar cajas duplicadas
    cajasCandidatas.sort((a, b) => b.conf - a.conf);
    let cajasFinales = [];
    while (cajasCandidatas.length > 0) {
      let best = cajasCandidatas.shift();
      cajasFinales.push(best);
      cajasCandidatas = cajasCandidatas.filter(box => calcularIoU(best, box) < 0.45);
    }

    // 5. Enviar a tu Tracker Acumulador
    procesarTracks(cajasFinales);
    dibujarBoundingBoxes();

  } catch (err) {
    console.error("Error procesando frame:", err);
  }
  isProcessing = false;
}

/* --- LÓGICA DE TRACKING (ACUMULACIÓN) --- */
function procesarTracks(detecciones) {
  let currentCentroids = detecciones.map(d => {
    // Normalizamos coordenadas entre 0 y 1 para facilitar el cálculo
    return {
      x: d.cx / INPUT_DIM,
      y: d.cy / INPUT_DIM,
      box: d,
      score: d.conf
    };
  });

  let matchedDetectionIndices = new Set();
  
  for (let i = 0; i < activeTracks.length; i++) {
    let track = activeTracks[i];
    let bestDist = MAX_DISTANCE;
    let bestDetIdx = -1;

    for (let j = 0; j < currentCentroids.length; j++) {
      if (matchedDetectionIndices.has(j)) continue;
      let det = currentCentroids[j];
      
      let dist = Math.hypot(track.x - det.x, track.y - det.y);
      if (dist < bestDist) {
        bestDist = dist;
        bestDetIdx = j;
      }
    }

    if (bestDetIdx !== -1) {
      track.x = currentCentroids[bestDetIdx].x;
      track.y = currentCentroids[bestDetIdx].y;
      track.box = currentCentroids[bestDetIdx].box;
      track.score = currentCentroids[bestDetIdx].score;
      track.missed = 0; 
      matchedDetectionIndices.add(bestDetIdx);
    } else {
      track.missed++;
    }
  }

  activeTracks = activeTracks.filter(t => t.missed < MAX_MISSED);

  for (let j = 0; j < currentCentroids.length; j++) {
    if (!matchedDetectionIndices.has(j)) {
      activeTracks.push({
        id: nextTrackId++,
        x: currentCentroids[j].x, y: currentCentroids[j].y,
        box: currentCentroids[j].box, score: currentCentroids[j].score, missed: 0
      });
      globalCount++; 
      liveCountNum.textContent = globalCount;
    }
  }
}

function calcularIoU(boxA, boxB) {
  let xA = Math.max(boxA.x, boxB.x);
  let yA = Math.max(boxA.y, boxB.y);
  let xB = Math.min(boxA.x + boxA.w, boxB.x + boxB.w);
  let yB = Math.min(boxA.y + boxA.h, boxB.y + boxB.h);
  let interArea = Math.max(0, xB - xA) * Math.max(0, yB - yA);
  let boxAArea = boxA.w * boxA.h;
  let boxBArea = boxB.w * boxB.h;
  return interArea / (boxAArea + boxBArea - interArea);
}

function dibujarBoundingBoxes(){
  octx.clearRect(0, 0, overlay.width, overlay.height);
  octx.lineWidth = 3; octx.font = 'bold 16px sans-serif';
  
  const scaleX = overlay.width / INPUT_DIM;
  const scaleY = overlay.height / INPUT_DIM;

  activeTracks.forEach(track => {
    if(track.missed > 0) return; 
    
    const x = track.box.x * scaleX;
    const y = track.box.y * scaleY;
    const w = track.box.w * scaleX;
    const h = track.box.h * scaleY;
    
    octx.strokeStyle = '#39FF6A'; 
    octx.strokeRect(x, y, w, h);
    
    const etiqueta = `#${track.id} ${Math.round(track.score * 100)}%`;
    const tw = octx.measureText(etiqueta).width;
    octx.fillStyle = '#39FF6A'; octx.fillRect(x, y - 20, tw + 8, 20);
    octx.fillStyle = '#000'; octx.fillText(etiqueta, x + 4, y - 5);
  });
}

btnGuardarSiguiente.addEventListener('click', ()=>{
  if(!especieActual) return;
  memoria[especieActual][`Árbol ${arbolActualNum}`] = globalCount;
  guardarMemoria(memoria);
  arbolActualNum += 1; camArbolLabel.textContent = `Árbol ${arbolActualNum}`;
  resetearTracker();
});

document.getElementById('btnVolver').addEventListener('click', ()=>{
  loopActivo = false;
  if(cameraStream){ cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  video.srcObject = null; octx.clearRect(0, 0, overlay.width, overlay.height);
  view2.style.display = 'none'; view1.style.display = 'block'; renderDashboard();
});

renderDashboard();
</script>
</body>
</html>
