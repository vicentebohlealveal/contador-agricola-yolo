<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ContaFrutos HSV En Vivo</title>
<style>
  :root{ --bg:#0A0A0A; --panel:#161616; --text:#EDEDED; --accent:#4CAF50;}
  body{margin:0; font-family:sans-serif; background:var(--bg); color:var(--text);}
  
  /* Interfaz principal simplificada */
  .header {padding: 15px; text-align: center; background: var(--panel);}
  .btn-start {display: block; width: 90%; margin: 20px auto; padding: 15px; background: var(--accent); color: #000; font-weight: bold; font-size: 16px; border: none; border-radius: 8px;}
  
  /* Overlay en vivo */
  .live-overlay {position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 100;}
  .live-overlay.show {display: flex;}
  
  .video-container {flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #111;}
  /* Usaremos un canvas en vez de video directo para dibujar los círculos encima */
  #mainCanvas {width: 100%; height: 100%; object-fit: contain;}
  video {display: none;} /* Video oculto, alimenta al canvas */
  
  .controls-panel {background: rgba(0,0,0,0.9); padding: 15px; border-top: 1px solid #333;}
  .count-display {font-size: 32px; font-weight: bold; color: var(--accent); text-align: center; margin-bottom: 10px;}
  
  /* Sliders compactos */
  .slider-row {display: flex; align-items: center; gap: 10px; margin-bottom: 5px; font-size: 12px;}
  .slider-row input {flex: 1;}
  
  .action-btns {display: flex; gap: 10px; margin-top: 15px;}
  .action-btns button {flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;}
  .btn-mask {background: #333; color: white;}
  .btn-next {background: var(--accent); color: black;}
</style>
</head>
<body>

<div class="header"><h1>Conteo por Color</h1></div>
<button class="btn-start" id="btnStartLive">🎥 Iniciar Cámara</button>

<!-- Pantalla de Conteo en Vivo -->
<div class="live-overlay" id="liveOverlay">
  <div class="video-container">
    <video id="liveVideo" autoplay playsinline></video>
    <canvas id="mainCanvas"></canvas>
  </div>
  
  <div class="controls-panel">
    <div class="count-display">Frutos: <span id="liveCount">0</span></div>
    
    <!-- Ajustes rápidos -->
    <div class="slider-row"><label>Tono Min</label><input type="range" id="hMin" min="0" max="360" value="40"></div>
    <div class="slider-row"><label>Tono Max</label><input type="range" id="hMax" min="0" max="360" value="75"></div>
    
    <div class="action-btns">
        <button class="btn-mask" id="btnToggleMask">Ver Máscara</button>
        <button class="btn-next" id="btnNext">Guardar y Siguiente</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const video = $('liveVideo');
const mainCanvas = $('mainCanvas');
const ctx = mainCanvas.getContext('2d', { willReadFrequently: true });

let animacionLoop = null;
let mostrandoMascara = false;

// Variables de calibración (las lee directo en el loop)
const getSettings = () => ({
    hMin: parseInt($('hMin').value),
    hMax: parseInt($('hMax').value),
    sMin: 35, vMin: 30, // Valores fijos por simplicidad, puedes agregar sus sliders
    sizeMinPct: 0.004, roundMin: 0.50
});

// Arrancar cámara
$('btnStartLive').addEventListener('click', async () => {
    $('liveOverlay').classList.add('show');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
        // Reducimos resolución de análisis para rendimiento
        mainCanvas.width = 160; 
        mainCanvas.height = 160 * (video.videoHeight / video.videoWidth);
        procesarFrame();
    };
});

$('btnToggleMask').addEventListener('click', () => {
    mostrandoMascara = !mostrandoMascara;
    $('btnToggleMask').textContent = mostrandoMascara ? 'Ver Normal' : 'Ver Máscara';
});

// Cierre / Siguiente
$('btnNext').addEventListener('click', () => {
    // Aquí iría tu lógica de guardar en localStorage
    alert("¡Guardado! Pasando al siguiente árbol...");
});

// --- EL NÚCLEO MATEMÁTICO ---
function procesarFrame() {
    if (video.paused || video.ended) return;
    
    const w = mainCanvas.width;
    const h = mainCanvas.height;
    
    // 1. Dibujar frame actual
    ctx.drawImage(video, 0, 0, w, h);
    const imgData = ctx.getImageData(0, 0, w, h);
    const px = imgData.data;
    const n = w * h;
    
    const s = getSettings();
    let mask = new Uint8Array(n);
    
    // 2. Filtro HSV
    for(let i=0; i<n; i++){
        const o = i*4;
        const [hh, ss, vv] = rgbToHsv(px[o], px[o+1], px[o+2]);
        if(hueInRange(hh, s.hMin, s.hMax) && ss >= s.sMin && vv >= s.vMin) {
            mask[i] = 1;
        }
    }
    
    // 3. Opcional: Erode/Dilate para limpiar ruido (comentado para máximo rendimiento, actívalo si hay mucha basura)
    // mask = erode3x3(mask, w, h); mask = dilate3x3(mask, w, h);
    
    // 4. Blob Detection (Agrupación)
    const visited = new Uint8Array(n);
    const minArea = Math.max(10, s.sizeMinPct * n);
    const blobs = [];
    const stack = new Int32Array(n);
    
    for(let start=0; start<n; start++){
        if(mask[start]!==1 || visited[start]) continue;
        let sp2=0; stack[sp2++]=start; visited[start]=1;
        let count=0, sumX=0, sumY=0, minX=w, maxX=0, minY=h, maxY=0;
        
        while(sp2>0){
            const idx = stack[--sp2]; 
            const x = idx % w, y = (idx/w)|0;
            count++; sumX+=x; sumY+=y;
            if(x<minX) minX=x; if(x>maxX) maxX=x; if(y<minY) minY=y; if(y>maxY) maxY=y;
            
            for(let dy=-1; dy<=1; dy++) for(let dx=-1; dx<=1; dx++){
                if(dx===0 && dy===0) continue;
                const nx=x+dx, ny=y+dy;
                if(nx<0||nx>=w||ny<0||ny>=h) continue;
                const nidx=ny*w+nx;
                if(mask[nidx]===1 && !visited[nidx]){ visited[nidx]=1; stack[sp2++]=nidx; }
            }
        }
        
        if(count >= minArea){
            const bw = maxX-minX+1, bh = maxY-minY+1;
            const aspect = bw>bh ? bw/bh : bh/bw;
            if(aspect <= 2.5) { // Control de redondez simple
                blobs.push({ cx: sumX/count, cy: sumY/count, r: Math.sqrt(count/Math.PI) });
            }
        }
    }
    
    // 5. Dibujar en pantalla
    if (mostrandoMascara) {
        // Pintamos la máscara de blanco y negro
        for(let i=0; i<n; i++){
            const o = i*4;
            const val = mask[i] ? 255 : 0;
            px[o] = val; px[o+1] = val; px[o+2] = val;
        }
        ctx.putImageData(imgData, 0, 0);
    } else {
        // Dibujamos círculos sobre el video original
        ctx.strokeStyle = '#4CAF50';
        ctx.lineWidth = 2;
        blobs.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.cx, b.cy, b.r, 0, Math.PI*2);
            ctx.stroke();
        });
    }
    
    $('liveCount').textContent = blobs.length;
    
    // Ciclo infinito
    animacionLoop = requestAnimationFrame(procesarFrame);
}

// Utilidades matemáticas
function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h=60*(((g-b)/d)%6);
    else if(max===g) h=60*((b-r)/d+2);
    else h=60*((r-g)/d+4);
  }
  if(h<0) h+=360;
  const s = max===0?0:d/max;
  return [h, s*100, max*100];
}
function hueInRange(h,hmin,hmax){ return hmin<=hmax ? (h>=hmin && h<=hmax) : (h>=hmin || h<=hmax); }

</script>
</body>
</html>
