<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ContaFrutos En Vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Importamos TensorFlow.js y el modelo pre-entrenado -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<style>
  :root{ --bg:#0A0A0A; --panel:#161616; --line:#2A2A2A; --text:#EDEDED; --dim:#8C8C8C; --danger:#C6553A; --accent:#4CAF50;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:48px;}
  .wrap{max-width:480px;margin:0 auto;padding:22px 18px 0;}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:30px;}
  .back-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:0 4px 0 0;}
  h1{font-weight:600;font-size:19px;margin:0;flex:1;}

  .list-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);}
  .list-row .name{flex:1;font-size:15px;font-weight:500;}
  .list-row .meta{font-size:12px;color:var(--dim);margin-top:2px;}
  .list-row .thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;}
  .del-btn{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;}

  .add-row{display:flex;gap:8px;padding:14px 4px 4px;}
  .add-row input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);outline:none;}
  .add-row button{background:var(--text);color:#000;border:none;border-radius:8px;padding:0 16px;font-weight:600;cursor:pointer;}

  .empty{font-size:13px;color:var(--dim);text-align:center;padding:24px 10px;border:1px solid var(--line);border-radius:8px;margin-top:4px;}
  .photo-btn{margin-top:4px;width:100%;background:var(--text);color:#000;border:none;border-radius:8px;font-weight:600;font-size:15px;padding:16px;cursor:pointer;}

  .avg-box{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
  .avg-label{font-size:12px;color:var(--dim);}
  .avg-value{font-size:34px;font-weight:700;margin-top:2px;}
  
  /* OVERLAY DE CÁMARA EN VIVO */
  .live-overlay{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:100;}
  .live-overlay.show{display:flex;}
  .live-header{padding:15px; display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.8);}
  .live-header h2{margin:0; font-size:18px;}
  .btn-close{background:none; border:none; color:white; font-size:24px; cursor:pointer;}
  
  .video-container{flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  video {width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0;}
  
  .live-footer{padding:20px; background:rgba(0,0,0,0.9); text-align:center; padding-bottom:40px;}
  .live-count-display{font-size:50px; font-weight:700; color:var(--accent); margin-bottom:10px;}
  .live-status{font-size:13px; color:var(--dim); margin-bottom:15px;}
  .btn-next-tree{width:100%; background:var(--accent); color:#000; border:none; border-radius:8px; font-weight:700; font-size:18px; padding:18px; cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back-btn" id="btnBack" style="display:none">←</button>
    <h1 id="pageTitle">Conteo</h1>
  </header>

  <div id="homeView">
    <div id="speciesList"></div>
    <div class="add-row">
      <input type="text" id="newSpeciesName" placeholder="Nueva especie (ej: Limones)">
      <button id="btnAddSpecies">Añadir</button>
    </div>
  </div>

  <div id="speciesView" style="display:none">
    <button class="photo-btn" id="btnStartLive">🎥 Iniciar Conteo en Vivo</button>
    <div id="treeList" style="margin-top:16px"></div>
    <div class="avg-box">
      <div class="avg-label">Frutos promedio total</div>
      <div class="avg-value" id="avgValue">—</div>
    </div>
  </div>
</div>

<!-- INTERFAZ DE CÁMARA EN VIVO -->
<div class="live-overlay" id="liveOverlay">
  <div class="live-header">
    <h2 id="liveTitle">Árbol 1</h2>
    <button class="btn-close" id="btnCloseLive">✕</button>
  </div>
  <div class="video-container">
    <video id="liveVideo" autoplay playsinline></video>
  </div>
  <div class="live-footer">
    <div class="live-count-display" id="liveCount">0</div>
    <div class="live-status" id="liveStatus">Cargando Inteligencia Artificial...</div>
    <button class="btn-next-tree" id="btnNextTree" disabled>Guardar y Siguiente Árbol</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// --- Lógica de Datos ---
function loadData(){
  try{ return JSON.parse(localStorage.getItem('contafrutos-data') || '{"species":[]}'); }
  catch(e){ return {species:[]}; }
}
function saveData(data){ localStorage.setItem('contafrutos-data', JSON.stringify(data)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let data = loadData();
let currentSpeciesId = null;
let currentTreeNumber = 1;

// --- Lógica de IA y Video ---
let modeloIA = null;
let videoStream = null;
let animacionLoop = null;
let ultimoConteo = 0;
const video = $('liveVideo');

async function cargarModelo() {
    if (!modeloIA) {
        modeloIA = await cocoSsd.load();
        $('liveStatus').textContent = "Buscando frutos...";
        $('btnNextTree').disabled = false;
    }
}

async function procesarVideo() {
    if (!modeloIA || video.paused || video.ended) return;
    
    // Detectamos objetos en el frame actual del video
    const predicciones = await modeloIA.detect(video);
    
    // Filtramos para engañar a la IA buscando manzanas/naranjas
    const frutos = predicciones.filter(p => p.class === 'orange' || p.class === 'apple');
    
    ultimoConteo = frutos.length;
    $('liveCount').textContent = ultimoConteo;

    // Repetimos el loop en el siguiente frame de video
    animacionLoop = requestAnimationFrame(procesarVideo);
}

// --- Navegación ---
function goHome(){
  currentSpeciesId = null;
  $('homeView').style.display='block'; $('speciesView').style.display='none';
  $('btnBack').style.display='none'; $('pageTitle').textContent='Conteo';
  renderHome();
}

function goSpecies(id){
  currentSpeciesId = id;
  $('homeView').style.display='none'; $('speciesView').style.display='block';
  $('btnBack').style.display='inline-block';
  const sp = getSpecies(id);
  $('pageTitle').textContent = sp.name;
  renderSpecies();
}

$('btnBack').addEventListener('click', goHome);
function getSpecies(id){ return data.species.find(s=>s.id===id); }

// --- Renderizado de Vistas ---
function renderHome(){
  const list = $('speciesList');
  if(data.species.length===0){ list.innerHTML = '<div class="empty">Agrega una especie para empezar</div>'; return; }
  list.innerHTML='';
  data.species.forEach(sp=>{
    const counts = sp.trees.map(t=>t.count);
    const avg = counts.length ? Math.round(counts.reduce((a,b)=>a+b,0)/counts.length) : null;
    const row = document.createElement('div'); row.className='list-row';
    row.innerHTML = `<div class="name" style="cursor:pointer">${sp.name} <div class="meta">${sp.trees.length} árboles ${avg!=null ? '· prom '+avg : ''}</div></div><button class="del-btn" data-id="${sp.id}">✕</button>`;
    row.querySelector('.name').addEventListener('click', ()=> goSpecies(sp.id));
    row.querySelector('.del-btn').addEventListener('click', (e)=>{
      if(confirm(`¿Borrar ${sp.name}?`)){ data.species = data.species.filter(s=>s.id!==sp.id); saveData(data); renderHome(); }
    });
    list.appendChild(row);
  });
}

$('btnAddSpecies').addEventListener('click', ()=>{
  const input = $('newSpeciesName');
  if(input.value.trim()){ data.species.push({id:uid(), name:input.value.trim(), trees:[]}); saveData(data); input.value=''; renderHome(); }
});

function renderSpecies(){
  const sp = getSpecies(currentSpeciesId);
  const list = $('treeList');
  currentTreeNumber = sp.trees.length + 1; // Setea el número para el próximo árbol
  
  if(sp.trees.length===0){ list.innerHTML = '<div class="empty">Inicia la cámara para registrar el primer árbol</div>'; }
  else{
    list.innerHTML='';
    [...sp.trees].reverse().forEach(tree=>{
      const row = document.createElement('div'); row.className='list-row';
      row.innerHTML = `<img class="thumb" src="${tree.thumb}"><div class="name">${tree.name}<div class="meta">${tree.count} frutos detectados</div></div><button class="del-btn">✕</button>`;
      row.querySelector('.del-btn').addEventListener('click', ()=>{
        if(confirm(`¿Borrar ${tree.name}?`)){ sp.trees = sp.trees.filter(t=>t.id!==tree.id); saveData(data); renderSpecies(); }
      });
      list.appendChild(row);
    });
  }
  const counts = sp.trees.map(t=>t.count);
  $('avgValue').textContent = counts.length ? Math.round(counts.reduce((a,b)=>a+b,0)/counts.length) : '—';
}

// --- Control Cámara en Vivo ---
$('btnStartLive').addEventListener('click', async ()=>{
  $('liveOverlay').classList.add('show');
  $('liveTitle').textContent = `Árbol ${currentTreeNumber}`;
  $('liveCount').textContent = '0';
  ultimoConteo = 0;
  
  try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = videoStream;
      video.onloadeddata = () => { procesarVideo(); };
      cargarModelo(); // Carga la IA si no estaba cargada
  } catch (err) {
      $('liveStatus').textContent = "Error: Sin acceso a cámara";
  }
});

$('btnCloseLive').addEventListener('click', ()=>{
  $('liveOverlay').classList.remove('show');
  cancelAnimationFrame(animacionLoop);
  if(videoStream) videoStream.getTracks().forEach(track => track.stop());
  renderSpecies(); // Actualiza la lista al cerrar
});

// Guardar y pasar al siguiente
$('btnNextTree').addEventListener('click', ()=>{
    const sp = getSpecies(currentSpeciesId);
    
    // Crear miniatura rapida desde el video actual
    const canvas = document.createElement('canvas');
    canvas.width = 80; canvas.height = 80;
    canvas.getContext('2d').drawImage(video, 0, 0, 80, 80);
    
    // Guardar registro
    sp.trees.push({
        id: uid(),
        name: `Árbol ${currentTreeNumber}`,
        count: ultimoConteo,
        thumb: canvas.toDataURL('image/jpeg', 0.5)
    });
    saveData(data);
    
    // Resetear para el siguiente
    currentTreeNumber++;
    $('liveTitle').textContent = `Árbol ${currentTreeNumber}`;
    
    // Feedback visual rápido
    $('liveOverlay').style.backgroundColor = 'white';
    setTimeout(() => { $('liveOverlay').style.backgroundColor = '#000'; }, 150);
});

// Iniciar app
goHome();
</script>
</body>
</html>
